# Packaging is deliberately thin: cortex has no dependencies and never will,
# so this file exists to make `pipx install` work, not to pull anything in.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-graph"
dynamic = ["version"]
description = "Your filesystem as a graph you can read, with terminal handoff to your editor."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ayush Sinha" }]
keywords = ["graph", "notes", "filesystem", "knowledge-graph", "neovim",
            "second-brain", "wikilinks", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ayushsinha322/cortex"
Source = "https://github.com/Ayushsinha322/cortex"

[project.scripts]
cortex = "cortex.cli:main"

[tool.setuptools]
packages = ["cortex"]

[tool.setuptools.dynamic]
version = { attr = "cortex.__init__.__version__" }

[tool.setuptools.package-data]
cortex = ["ui/*.html", "ui/*.css", "ui/*.js"]
