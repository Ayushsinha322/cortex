# Packaging is deliberately thin: cortex has no dependencies and never will,
# so this file exists to make `pipx install` work, not to pull anything in.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-fs"
dynamic = ["version"]
description = "Your filesystem as a graph you can read, with terminal handoff to your editor."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayush Sinha" }]
keywords = ["graph", "notes", "filesystem", "knowledge-graph", "neovim",
            "second-brain", "wikilinks", "terminal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ayushsinha322/cortex"
Source = "https://github.com/Ayushsinha322/cortex"
Issues = "https://github.com/Ayushsinha322/cortex/issues"

[project.scripts]
cortex = "cortex.cli:main"

[tool.setuptools]
# ui/ holds no code, only the window's files, but naming it here stops
# setuptools guessing at it and ships them without a MANIFEST.
packages = ["cortex", "cortex.ui"]

[tool.setuptools.dynamic]
version = { attr = "cortex.__init__.__version__" }

[tool.setuptools.package-data]
cortex = ["ui/*.html", "ui/*.css", "ui/*.js"]
