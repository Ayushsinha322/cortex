name: pages

# The demo is static files under docs/, so there is nothing to build — this
# only hands that directory to Pages. It runs when those files change rather
# than on every push, because publishing an unchanged site is just noise.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the last
# push to land is the one that ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: publish docs/ to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement lets the workflow turn Pages on itself, rather than
      # failing when the repository has not had it switched on by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: the demo is there to publish
        run: |
          test -f docs/index.html || { echo "docs/index.html missing"; exit 1; }
          test -f docs/demo/index.html || { echo "docs/demo/index.html missing"; exit 1; }
          test -f docs/demo/demo-data.json || { echo "the fixture is missing"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
